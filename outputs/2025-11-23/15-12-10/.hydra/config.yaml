train:
  features:
    columns:
    - dayofyear
    - hour
    - dayofweek
    - quarter
    - month
    - year
    - lag_364d
    - lag_728d
    - lag_1092d
  target: PJME_MW
  processed_path: data/processed/energy_features.csv
  train_end: '2014-01-01'
  model:
    name: xgboost
    booster: gbtree
    n_estimators: 1000
    max_depth: 3
    learning_rate: 0.01
    base_score: 0.5
    objective: reg:squarederror
  cv:
    n_splits: 5
    test_size: 8760
    gap: 24
